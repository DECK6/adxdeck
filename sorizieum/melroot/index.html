<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee9dd"><title>멜루트 — 김수린</title><link rel="stylesheet" href="style.css?v=3.4">
<script type="importmap">{"imports":{"three":"./lib/vendor/three/three.module.js"}}</script>
<script defer src="lib/vendor/face_mesh/face_mesh.js"></script><script defer src="lib/face-features.js"></script><script defer src="lib/body-tracking.js?v=3.4"></script>
</head><body>
<main class="experience">
 <header><div class="wordmark">소리를 보다 <span>미디어아트 작품전</span></div><button id="fullscreen" class="quiet">전체 화면 <span aria-hidden="true">↗</span></button></header>
 <section class="intro" aria-labelledby="title"><p class="eyebrow">김수린 · INTERACTIVE CHARACTER</p><h1 id="title">멜루트</h1><p class="invitation">당신의 움직임으로<br>깨어나는 작은 숲.</p><p class="instruction" id="instruction">얼굴과 양팔이 보이도록 서 주세요.<br>몸과 손을 움직이면 주변에 식물이 자라나요.</p></section>
 <section id="stage" aria-label="움직이는 멜루트와 바닥에서 자라는 작은 숲"><div class="halo" aria-hidden="true"></div><div id="loading" role="status">멜루트를 불러오는 중…</div></section>
 <aside id="camera-panel" aria-label="카메라 미리보기" hidden><video id="camera" autoplay muted playsinline></video><span>거울처럼 움직여 보세요</span></aside>
 <footer><div class="control-stack"><div class="tracking-modes" role="group" aria-label="트래킹 모드"><button id="mode-upper" aria-pressed="true">상체</button><button id="mode-full" aria-pressed="false">전신</button><span>표정과 손도 함께</span></div><div class="controls"><button id="camera-toggle" class="primary" disabled><span class="camera-icon" aria-hidden="true">◉</span><span id="camera-label">카메라 켜기</span></button><button id="recenter" class="quiet" hidden>정면 맞추기</button><p id="status" role="status" aria-live="polite">캐릭터를 준비하고 있습니다.</p></div></div><p class="privacy">카메라 영상은 이 기기에서만 사용하며<br>저장하거나 전송하지 않습니다.</p></footer>
</main><script type="module" src="lib/app.mjs?v=3.7"></script></body></html>
