<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEXA NARA — AITY 입찰 추천</title>
    <meta name="description" content="나라장터 입찰 즐겨찾기와 제안서 초안 공유 보관함" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=e2294aba" />
    <link rel="stylesheet" href="deck.css?v=e2294aba" />
  </head>
  <body>
    <section class="lock-screen" id="lockScreen">
      <div class="lock-panel">
        <div class="panel-strip">
          <span class="led" id="lockLed"></span>
          <span class="mono strip-label">DEXA · NARA VAULT</span>
        </div>
        <h1>입찰 보관함<span class="dot">.</span></h1>
        <p class="lock-sub mono">PASSWORD REQUIRED — 암호화된 보관함입니다</p>
        <form id="lockForm">
          <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" autofocus />
          <button type="submit" id="unlockButton">열기</button>
        </form>
        <p class="lock-error mono" id="lockError" hidden>비밀번호가 맞지 않습니다</p>
      </div>
    </section>

    <div class="app" id="app" hidden>
      <header class="app-header">
        <div class="brand">
          <span class="brand-name">DEXA<span class="dot">.</span></span>
          <span class="mono brand-sub">NARA — AITY 맞춤 입찰 추천 · 보관함</span>
        </div>
        <div class="header-meta mono">
          <span id="metaCount"></span>
          <span id="metaUpdated"></span>
          <button class="ghost-button mono" id="lockButton" type="button">잠금</button>
        </div>
      </header>
      <nav class="view-tabs mono" id="viewTabs">
        <button type="button" data-view="recommend" class="active">AITY 추천</button>
        <button type="button" data-view="vault">보관함</button>
      </nav>
      <main id="recommendView"></main>
      <main class="cards" id="cards" hidden></main>
      <footer class="app-footer mono">DEXA · shared bid vault · 자료는 내부 검토용입니다</footer>
    </div>

    <div class="viewer-overlay" id="viewerOverlay" hidden>
      <section class="viewer-panel">
        <header class="viewer-header">
          <div class="viewer-title-group">
            <h2 id="viewerTitle"></h2>
            <div class="viewer-meta mono" id="viewerMeta"></div>
          </div>
          <div class="viewer-actions">
            <button class="ghost-button mono" id="slidesButton" type="button" hidden>슬라이드</button>
            <button class="ghost-button mono" id="copyButton" type="button">MD 복사</button>
            <button class="ghost-button mono" id="closeViewer" type="button">닫기</button>
          </div>
        </header>
        <nav class="version-tabs mono" id="versionTabs"></nav>
        <article class="markdown" id="draftBody"></article>
      </section>
    </div>

    <div class="viewer-overlay" id="requestOverlay" hidden>
      <form class="request-panel" id="requestForm">
        <h2>초안 요청</h2>
        <p class="request-title" id="requestTitle"></p>
        <label class="mono">요청자<input id="requestName" maxlength="40" placeholder="이름" required /></label>
        <label class="mono">메모<textarea id="requestNote" maxlength="500" rows="3" placeholder="강조할 점, 참여 형태 등 (선택)"></textarea></label>
        <p class="lock-error mono" id="requestError" hidden></p>
        <div class="request-actions">
          <button class="ghost-button mono" id="requestCancel" type="button">취소</button>
          <button class="primary-button" id="requestSubmit" type="submit">요청 보내기</button>
        </div>
      </form>
    </div>

    <div class="deck-overlay" id="deckOverlay" hidden>
      <button class="ghost-button mono deck-close" id="deckClose" type="button">닫기</button>
      <div class="deck-host" id="deckHost"></div>
    </div>

    <script src="marked.min.js?v=e2294aba"></script>
    <script src="deck.js?v=e2294aba"></script>
    <script src="app.js?v=e2294aba"></script>
  </body>
</html>
