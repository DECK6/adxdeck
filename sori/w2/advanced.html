  :host {
    display: block;
    position: relative;
    overflow: hidden;
    background: #000;
    contain: layout style;
  }

  .hfp-container {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }


  .hfp-iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    border: none;
    pointer-events: none;
  }

  /* Opt-in: an interactive composition (e.g. a live slideshow/app with playable
     media or controls) \u2014 let pointer events reach the iframe content. */
  :host([interactive]) .hfp-container,
  :host([interactive]) .hfp-iframe {
    pointer-events: auto;
  }

  .hfp-poster {
    position: absolute;
    inset: 0;
    object-fit: contain;
    z-index: 1;
    pointer-events: none;
  }

  .hfp-shader-loader {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: #030504;
    color: #f4f7fb;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    transition: opacity 420ms ease-out, visibility 420ms ease-out;
  }

  .hfp-shader-loader.hfp-visible,
  .hfp-shader-loader.hfp-hiding {
    visibility: visible;
  }

  .hfp-shader-loader.hfp-visible {
    opacity: 1;
    pointer-events: auto;
  }

  .hfp-shader-loader.hfp-hiding {
    opacity: 0;
    pointer-events: none;
  }

  .hfp-shader-loader-panel {
    display: grid;
    grid-template-rows: 86px 40px 26px 12px 44px;
    justify-items: center;
    align-items: center;
    gap: 8px;
    width: min(620px, 82%);
    text-align: center;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .hfp-shader-loader-mark {
    width: 86px;
    height: 86px;
    display: grid;
    place-items: center;
    overflow: visible;
  }

  .hfp-shader-loader-mark svg {
    display: block;
    overflow: visible;
    filter: drop-shadow(0 0 5px rgba(79, 219, 94, 0.16));
    pointer-events: none;
  }

  .hfp-shader-loader-title {
    width: 100%;
    height: 40px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 26px;
    line-height: 40px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .hfp-shader-loader-title-text {
    color: transparent;
    background: linear-gradient(
      90deg,
      rgba(244, 247, 251, 0.84) 0%,
      #ffffff 42%,
      #80efe4 52%,
      #ffffff 62%,
      rgba(244, 247, 251, 0.84) 100%
    );
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    animation: hfp-shader-loader-sheen 1.9s linear infinite;
  }

  .hfp-shader-loader:not(.hfp-visible):not(.hfp-hiding) .hfp-shader-loader-title-text {
    animation-play-state: paused;
  }

  .hfp-shader-loader-detail {
    width: 100%;
    height: 26px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: rgba(244, 247, 251, 0.62);
    font-size: 15px;
    line-height: 26px;
    font-weight: 500;
  }

  .hfp-shader-loader-track {
    width: min(360px, 100%);
    height: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
  }

  .hfp-shader-loader-fill {
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #06e3fa, #4fdb5e);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 160ms ease;
  }

  .hfp-shader-loader-progress {
    width: min(420px, 100%);
    height: 44px;
    display: grid;
    grid-template-rows: repeat(2, 22px);
    color: rgba(244, 247, 251, 0.48);
    font: 600 13px/22px "IBM Plex Mono", "SF Mono", "Fira Code", "Courier New", monospace;
    font-variant-numeric: tabular-nums;
  }

  .hfp-shader-loader-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 74px;
    align-items: center;
    column-gap: 20px;
    width: 100%;
    white-space: nowrap;
  }

  .hfp-shader-loader-label {
    min-width: 0;
    overflow: hidden;
    text-align: left;
    text-overflow: ellipsis;
  }

  .hfp-shader-loader-value {
    text-align: right;
  }

  @keyframes hfp-shader-loader-sheen {
    from {
      background-position: 140% 0;
    }
    to {
      background-position: -140% 0;
    }
  }

  /* \u2500\u2500 Theming via CSS custom properties \u2500\u2500
   *
   * Override from outside the shadow DOM:
   *   hyperframes-player {
   *     --hfp-controls-bg: linear-gradient(transparent, rgba(0,0,0,0.9));
   *     --hfp-accent: #ff6b6b;
   *     --hfp-font: "Inter", sans-serif;
   *   }
   */

  .hfp-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: var(--hfp-controls-gap, 12px);
    padding: var(--hfp-controls-padding, 8px 16px);
    background: var(--hfp-controls-bg, linear-gradient(transparent, rgba(0, 0, 0, 0.7)));
    color: var(--hfp-color, #fff);
    font-family: var(--hfp-font, system-ui, -apple-system, sans-serif);
    font-size: var(--hfp-font-size, 13px);
    z-index: 10;
    pointer-events: auto;
    opacity: 1;
    transition: opacity 0.3s ease;
    user-select: none;
  }

  .hfp-controls.hfp-hidden {
    opacity: 0;
    pointer-events: none;
  }

  .hfp-play-btn {
    position: relative;
    background: none;
    border: none;
    color: var(--hfp-color, #fff);
    cursor: pointer;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    z-index: 10;
  }

  .hfp-play-btn:hover {
    opacity: 0.8;
  }

  /* Stacked play/pause glyphs that crossfade-morph on toggle (rotate + scale). */
  .hfp-play-btn .hfp-ico {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      opacity 200ms ease,
      transform 220ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .hfp-play-btn .hfp-ico-play {
    opacity: 1;
    transform: rotate(0) scale(1);
  }
  .hfp-play-btn .hfp-ico-pause {
    opacity: 0;
    transform: rotate(-90deg) scale(0.4);
  }
  .hfp-play-btn.hfp-playing .hfp-ico-play {
    opacity: 0;
    transform: rotate(90deg) scale(0.4);
  }
  .hfp-play-btn.hfp-playing .hfp-ico-pause {
    opacity: 1;
    transform: rotate(0) scale(1);
  }
  @media (prefers-reduced-motion: reduce) {
    .hfp-play-btn .hfp-ico {
      transition-duration: 0ms;
      transform: none;
    }
  }

  .hfp-play-btn svg,
  .hfp-play-btn svg * {
    pointer-events: none;
  }

  .hfp-scrubber {
    flex: 1;
    min-width: 0;
    height: var(--hfp-scrubber-height, 4px);
    background: var(--hfp-scrubber-bg, rgba(255, 255, 255, 0.3));
    border-radius: var(--hfp-scrubber-radius, 2px);
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .hfp-scrubber:hover {
    height: var(--hfp-scrubber-height-hover, 6px);
  }

  .hfp-progress {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--hfp-accent, #fff);
    pointer-events: none;
  }

  .hfp-time {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    opacity: 0.9;
  }

  .hfp-speed-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .hfp-speed-btn {
    background: var(--hfp-speed-btn-bg, rgba(255, 255, 255, 0.15));
    border: none;
    border-radius: var(--hfp-speed-btn-radius, 4px);
    color: var(--hfp-color, #fff);
    cursor: pointer;
    font-family: var(--hfp-font, system-ui, -apple-system, sans-serif);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    padding: 4px 8px;
    min-width: 40px;
    text-align: center;
    transition: background 0.15s ease;
  }

  .hfp-speed-btn:hover {
    background: var(--hfp-speed-btn-bg-hover, rgba(255, 255, 255, 0.3));
  }

  .hfp-speed-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: var(--hfp-menu-bg, rgba(20, 20, 20, 0.95));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--hfp-menu-border, rgba(255, 255, 255, 0.1));
    border-radius: var(--hfp-menu-radius, 8px);
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 80px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
    box-shadow: var(--hfp-menu-shadow, 0 8px 24px rgba(0, 0, 0, 0.4));
  }

  .hfp-speed-menu.hfp-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .hfp-speed-option {
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--hfp-menu-color, rgba(255, 255, 255, 0.7));
    cursor: pointer;
    font-family: var(--hfp-font, system-ui, -apple-system, sans-serif);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    padding: 6px 12px;
    text-align: left;
    transition: background 0.1s ease, color 0.1s ease;
    white-space: nowrap;
  }

  .hfp-speed-option:hover {
    background: var(--hfp-menu-hover-bg, rgba(255, 255, 255, 0.1));
    color: var(--hfp-color, #fff);
  }

  .hfp-speed-option.hfp-active {
    color: var(--hfp-accent, #fff);
    font-weight: 600;
  }

  .hfp-volume-wrap {
    position: relative;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .hfp-mute-btn {
    background: none;
    border: none;
    color: var(--hfp-color, #fff);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    flex-shrink: 0;
  }

  .hfp-mute-btn:hover {
    opacity: 0.8;
  }

  .hfp-mute-btn svg,
  .hfp-mute-btn svg * {
    pointer-events: none;
  }

  .hfp-volume-slider-wrap {
    width: 0;
    overflow: hidden;
    transition: width 0.2s ease;
    display: flex;
    align-items: center;
  }

  .hfp-volume-wrap:hover .hfp-volume-slider-wrap {
    width: 64px;
  }

  .hfp-volume-slider {
    width: 56px;
    height: var(--hfp-scrubber-height, 4px);
    background: var(--hfp-scrubber-bg, rgba(255, 255, 255, 0.3));
    border-radius: var(--hfp-scrubber-radius, 2px);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    margin-left: 4px;
    margin-right: 4px;
  }

  .hfp-volume-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--hfp-accent, #fff);
    pointer-events: none;
  }

//# sourceMappingURL=hyperframes-slideshow.global.js.map</script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111a1b;font-family:system-ui,sans-serif}</style></head><body><hyperframes-slideshow tabindex="0" notes-storage-key="sorijeum-week2-advanced" style="display:block;position:relative;width:100vw;height:100vh"><hyperframes-player interactive width="1920" height="1080" style="position:absolute;inset:0"></hyperframes-player><script type="application/hyperframes-slideshow+json">{"slides": [{"sceneId": "root", "notes": "0–1분 | 2주차 확정 범위: 무료 Gemini 또는 ChatGPT로 텍스트 대화하며 작품 기획. TouchDesigner 설치·노드 조작·AI 에이전트/MCP 연결 실습은 하지 않는다.", "startTime": 0, "endTime": 10}, {"sceneId": "recall", "notes": "1–5분 | 1주차 소재·규칙 메모를 꺼낸다. 소재가 이미 정해졌으면 새로 찾게 하지 말고 연결한다. 한 사람당 소재 한 가지에 집중한다.", "startTime": 10, "endTime": 20}, {"sceneId": "seed", "notes": "5–8분 | 소재 이름만 나열하지 않고 어떤 특징이 마음에 남았는지 묻는다. 정서나 해석은 개인 선택이며 정답이 없다.", "startTime": 20, "endTime": 30}, {"sceneId": "route", "notes": "8–10분 | 90분: 소재10, 대화 시연15, 질문·후보20, 선택15, 기획20, 공유10. 수업 결과는 학생이 선택한 계획 한 장이다.", "startTime": 30, "endTime": 40}, {"sceneId": "tool", "notes": "10–12분 | 두 서비스 중 하나만 선택한다. 유료 결제, 특정 모델 선택, 파일 업로드, 이미지·영상 생성은 수업 필수 요소가 아니다. 수업 전 계정 접근과 센터의 미성년자 이용 조건을 확인한다. 접속/사용량 제한이 생기면 수업용 가상 대화와 짝의 질문으로 진행해 계획을 완성한다. 실명·학교·연락처 대신 작품 소재를 입력한다.", "startTime": 40, "endTime": 50}, {"sceneId": "roles", "notes": "12–15분 | 프롬프트를 고정 공식으로 암기시키지 않는다. 목표와 필요한 맥락을 자기 말로 쓰고 후속 메시지로 다듬는 흐름. 공식 참고: https://learn.chatgpt.com/docs/prompting . AI가 제시한 사실·구현 방법은 별도 확인이 필요하다.", "startTime": 50, "endTime": 60}, {"sceneId": "start-prompt", "notes": "15–18분 | 문장 모음 페이지에서 복사 가능. 교사는 자신의 예시 소재를 넣어 시연한다. 입문자라는 조건과 한 번에 질문 하나라는 대화 속도만 짚는다. 정해진 모델이나 프롬프트 기능은 요구하지 않는다.", "startTime": 60, "endTime": 70}, {"sceneId": "dialogue-question", "notes": "18–21분 | 실제 서비스의 고정 답변이나 실행 기록이 아니라 강사가 만든 가상 대화임을 분명히 한다. 예시의 핵심은 소재→특정 순간으로 관심이 좁아지는 과정이다.", "startTime": 70, "endTime": 80}, {"sceneId": "dialogue-taste", "notes": "21–23분 | AI 질문이 마음과 맞지 않으면 질문 방향을 바꾸라고 말해도 된다. 참가자는 제안에 동의만 하는 사람이 아니라 취향과 의도를 제시하는 사람이다.", "startTime": 80, "endTime": 90}, {"sceneId": "steer", "notes": "23–25분 | 시연 종료. 응답이 길면 요약을 요청한다. 답을 그대로 복사해서 과제를 끝내지 않고 자신이 선택한 부분을 표시하도록 안내한다.", "startTime": 90, "endTime": 100}, {"sceneId": "talk", "notes": "25–32분 | 첫 프롬프트를 입력하고 질문 2~3개에 자기 말로 답한다. 한 번에 여러 질문이 오면 하나만 골라 답해도 된다. 강사는 막힌 학생에게 소재의 움직임·소리·시간 중 한 가지를 물어본다.", "startTime": 100, "endTime": 110}, {"sceneId": "keep", "notes": "32–37분 | 개별 대화를 이어간다. 기록할 것은 전체 대화가 아니라 내가 밝힌 관심, 유지할 것, 바꿀 것. 대화가 잘 진행되는 학생에게 후보 요청으로 넘어가도록 안내한다.", "startTime": 110, "endTime": 120}, {"sceneId": "candidates-prompt", "notes": "37–40분 | 후보2~3개면 충분하다. 계속 새 후보를 뽑느라 선택 시간을 쓰지 않게 한다. 소재와 관계없는 제안에는 내 소재를 다시 알려주라고 안내한다.", "startTime": 120, "endTime": 130}, {"sceneId": "candidate-example", "notes": "40–45분 | 세 후보는 수업용 창작 예시. 학생은 자기 후보에서 다른 점을 표시한다. 감정과 움직임의 관계가 서로 어떻게 다른지 설명해보게 한다.", "startTime": 130, "endTime": 140}, {"sceneId": "choose", "notes": "45–50분 | 후보마다 한 줄씩 이유를 적고 하나를 선택한다. AI에게 점수만 매겨 최종 선택을 맡기지 않는다. 중간에 바뀔 수 있지만 오늘의 선택본은 남긴다.", "startTime": 140, "endTime": 150}, {"sceneId": "choose-prompt", "notes": "50–54분 | 문장 모음에서 복사한 뒤 대괄호를 직접 채운다. 수정 방향이 여러 개면 가장 중요한 것부터 하나씩 다룬다.", "startTime": 150, "endTime": 160}, {"sceneId": "select-example", "notes": "54–57분 | 가상 대화. 말만 예쁜 설명이 아니라 화면에서 확인할 수 있는 결정으로 구체화되는지 본다. 여러 점을 추가할지는 이후 선택이다.", "startTime": 160, "endTime": 170}, {"sceneId": "decision", "notes": "57–60분 | 참가자가 직접 쓴 의도문 한 문장을 확보한다. AI가 만든 멋진 이름보다 자기 관심을 설명할 수 있는지 확인한다.", "startTime": 170, "endTime": 180}, {"sceneId": "rule", "notes": "60–64분 | 모든 작품에 관객 반응이 필수인 것은 아니다. 시간에 따라 변하는 작품도 가능하다. 오늘은 관계를 계획하는 단계이며 실제 TouchDesigner 구현 범위는 강사와 확인한다.", "startTime": 180, "endTime": 190}, {"sceneId": "rule-prompt", "notes": "64–67분 | 새 기능을 계속 더하지 말고 선택한 작품에 필요한 관계 하나를 남긴다. 규칙이 모호하면 크다/작다, 빠르다/느리다 같은 비교로 구체화한다.", "startTime": 190, "endTime": 200}, {"sceneId": "small-start", "notes": "67–70분 | 첫 제작과 이후 확장은 구분해 기록한다. AI에게 입문자 조건으로 줄여 달라고 요청할 수 있다. AI가 제안한 제작 난이도는 교사의 검토가 필요하다. 기술 용어를 외우는 시간으로 바꾸지 않는다.", "startTime": 200, "endTime": 210}, {"sceneId": "plan-form", "notes": "70–74분 | 활동지의 다섯 항목을 채운다: 의도, 화면, 움직임, 소리/관객 관계, 첫 범위. 모르는 부분은 미정으로 적고 강사에게 질문한다. 전체 채팅을 제출하는 것이 아니다.", "startTime": 210, "endTime": 220}, {"sceneId": "plan-example", "notes": "74–77분 | 수업용 창작 예시. 참가자는 자신의 기획과 비교해 빠진 부분을 찾는다. 이 예시가 학생 모두의 정답이 되지 않게 한다. 소리 분석·도형 연결은 이후 실제 제작에서 다룬다.", "startTime": 220, "endTime": 230}, {"sceneId": "own-words", "notes": "77–80분 | AI의 정리문을 읽고 실제로 선택하지 않은 내용을 고친다. 미정은 강사 확인 항목으로 남긴다. 그림 실력과 글 길이는 평가하지 않는다.", "startTime": 230, "endTime": 240}, {"sceneId": "share", "notes": "80–85분 | 짝끼리 각2분 소개하고1분 피드백. 전체 발표보다 모든 학생의 계획 확인을 우선한다. 교사는 실현 범위가 큰 학생부터 짧게 피드백한다.", "startTime": 240, "endTime": 250}, {"sceneId": "check", "notes": "85–88분 | 장비와 입문 수준을 고려해 다음 실습의 최소 범위를 확인한다. 구현하지 않은 기능을 작동한다고 확정하지 않는다. 남은 의문은 한 가지 질문으로 기록한다.", "startTime": 250, "endTime": 260}, {"sceneId": "finish", "notes": "88–90분 | 계획을 개인 노트/파일로 저장한다. 공유 화면에 계정명이나 채팅 사이드바를 노출할 필요는 없다. 다음 수업에서 TouchDesigner 기초와 연결할 수 있으나 세부 도입 회차는 별도 확정한다.", "startTime": 260, "endTime": 270}], "slideSequences": []}</script></hyperframes-slideshow><script id="composition-source" type="application/json">"\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>소리지음 · 대화로 정하는 작품\u003c/title>\u003cstyle>\n*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:system-ui,sans-serif;color:var(--ink);background:var(--bg)}\nbody.young{--bg:#f5f0e6;--ink:#163c37;--muted:#526d65;--accent:#d8492e;--panel:#fffaf1;--line:#c5cfc3;--tint:#dde8ce;--strong:#214f43}\nbody.advanced{--bg:#111a1b;--ink:#eef4e8;--muted:#b2c0b8;--accent:#d0ee7e;--panel:#1b2829;--line:#425451;--tint:#2b3c31;--strong:#d0ee7e}\n.scene-frame{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;padding:60px 80px 116px;background:var(--bg)}\n.topline{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--line);padding-bottom:20px;color:var(--muted);font-size:27px;letter-spacing:.07em}\n.phase{color:var(--accent);font-weight:750}.slide-title{font-size:76px;line-height:1.18;letter-spacing:-.045em;word-break:keep-all;margin:45px 0 40px;font-weight:780;max-width:1760px}\n.scene-frame.art .slide-title{font-size:64px;margin:30px 0 28px;min-height:76px}\n.content{width:100%}.tool-note{font-size:40px;color:var(--muted);margin-top:35px}.footer{position:absolute;left:80px;bottom:40px;display:flex;gap:28px;color:var(--muted);font-size:26px}.footer b{font-weight:700;color:var(--accent)}\np{margin:0;line-height:1.5;word-break:keep-all}h3{font-size:56px;line-height:1.23;letter-spacing:-.04em;margin:0 0 30px;word-break:keep-all;font-weight:740}\n.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:60px}.card{background:var(--panel);border-top:6px solid var(--accent);padding:40px;min-height:440px}.card p{font-size:42px;color:var(--muted)}.step{font-size:42px;color:var(--accent);margin-bottom:35px;font-weight:700}\n.statement{border-left:9px solid var(--accent);padding:12px 0 14px 60px;margin-top:85px;max-width:1640px}.statement>p{font-size:64px;line-height:1.48;letter-spacing:-.025em}.statement-sub{font-size:40px;line-height:1.55;color:var(--muted);margin-top:46px;word-break:keep-all}\n.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:60px}.panel{padding:48px;background:var(--panel);border-top:5px solid var(--accent);min-height:440px}.panel p{font-size:46px;line-height:1.55}.panel h3{color:var(--accent);font-size:44px}\n.lines{margin-top:50px;border-top:2px solid var(--line)}.line{display:grid;grid-template-columns:360px 1fr;gap:44px;padding:36px 28px;border-bottom:2px solid var(--line);font-size:45px;line-height:1.45}.line b{color:var(--accent)}\n.worksheet{display:grid;grid-template start-prompt\", \"notes\": \"15–18분 | 문장 모음 페이지에서 복사 가능. 교사는 자신의 예시 소재를 넣어 시연한다. 입문자라는 조건과 한 번에 질문 하나라는 대화 속도만 짚는다. 정해진 모델이나 프롬프트 기능은 요구하지 않는다.\", \"startTime\": 60, \"endTime\": 70}, {\"sceneId\": \"dialogue-question\", \"notes\": \"18–21분 | 실제 서비스의 고정 답변이나 실행 기록이 아니라 강사가 만든 가상 대화임을 분명히 한다. 예시의 핵심은 소재→특정 순간으로 관심이 좁아지는 과정이다.\", \"startTime\": 70, \"endTime\": 80}, {\"sceneId\": \"dialogue-taste\", \"notes\": \"21–23분 | AI 질문이 마음과 맞지 않으면 질문 방향을 바꾸라고 말해도 된다. 참가자는 제안에 동의만 하는 사람이 아니라 취향과 의도를 제시하는 사람이다.\", \"startTime\": 80, \"endTime\": 90}, {\"sceneId\": \"steer\", \"notes\": \"23–25분 | 시연 종료. 응답이 길면 요약을 요청한다. 답을 그대로 복사해서 과제를 끝내지 않고 자신이 선택한 부분을 표시하도록 안내한다.\", \"startTime\": 90, \"endTime\": 100}, {\"sceneId\": \"talk\", \"notes\": \"25–32분 | 첫 프롬프트를 입력하고 질문 2~3개에 자기 말로 답한다. 한 번에 여러 질문이 오면 하나만 골라 답해도 된다. 강사는 막힌 학생에게 소재의 움직임·소리·시간 중 한 가지를 물어본다.\", \"startTime\": 100, \"endTime\": 110}, {\"sceneId\": \"keep\", \"notes\": \"32–37분 | 개별 대화를 이어간다. 기록할 것은 전체 대화가 아니라 내가 밝힌 관심, 유지할 것, 바꿀 것. 대화가 잘 진행되는 학생에게 후보 요청으로 넘어가도록 안내한다.\", \"startTime\": 110, \"endTime\": 120}, {\"sceneId\": \"candidates-prompt\", \"notes\": \"37–40분 | 후보2~3개면 충분하다. 계속 새 후보를 뽑느라 선택 시간을 쓰지 않게 한다. 소재와 관계없는 제안에는 내 소재를 다시 알려주라고 안내한다.\", \"startTime\": 120, \"endTime\": 130}, {\"sceneId\": \"candidate-example\", \"notes\": \"40–45분 | 세 후보는 수업용 창작 예시. 학생은 자기 후보에서 다른 점을 표시한다. 감정과 움직임의 관계가 서로 어떻게 다른지 설명해보게 한다.\", \"startTime\": 130, \"endTime\": 140}, {\"sceneId\": \"choose\", \"notes\": \"45–50분 | 후보마다 한 줄씩 이유를 적고 하나를 선택한다. AI에게 점수만 매겨 최종 선택을 맡기지 않는다. 중간에 바뀔 수 있지만 오늘의 선택본은 남긴다.\", \"startTime\": 140, \"endTime\": 150}, {\"sceneId\": \"choose-prompt\", \"notes\": \"50–54분 | 문장 모음에서 복사한 뒤 대괄호를 직접 채운다. 수정 방향이 여러 개면 가장 중요한 것부터 하나씩 다룬다.\", \"startTime\": 150, \"endTime\": 160}, {\"sceneId\": \"select-example\", \"notes\": \"54–57분 | 가상 대화. 말만 예쁜 설명이 아니라 화면에서 확인할 수 있는 결정으로 구체화되는지 본다. 여러 점을 추가할지는 이후 선택이다.\", \"startTime\": 160, \"endTime\": 170}, {\"sceneId\": \"decision\", \"notes\": \"57–60분 | 참가자가 직접 쓴 의도문 한 문장을 확보한다. AI가 만든 멋진 이름보다 자기 관심을 설명할 수 있는지 확인한다.\", \"startTime\": 170, \"endTime\": 180}, {\"sceneId\": \"rule\", \"notes\": \"60–64분 | 모든 작품에 관객 반응이 필수인 것은 아니다. 시간에 따라 변하는 작품도 가능하다. 오늘은 관계를 계획하는 단계이며 실제 TouchDesigner 구현 범위는 강사와 확인한다.\", \"startTime\": 180, \"endTime\": 190}, {\"sceneId\": \"rule-prompt\", \"notes\": \"64–67분 | 새 기능을 계속 더하지 말고 선택한 작품에 필요한 관계 하나를 남긴다. 규칙이 모호하면 크다/작다, 빠르다/느리다 같은 비교로 구체화한다.\", \"startTime\": 190, \"endTime\": 200}, {\"sceneId\": \"small-start\", \"notes\": \"67–70분 | 첫 제작과 이후 확장은 구분해 기록한다. AI에게 입문자 조건으로 줄여 달라고 요청할 수 있다. AI가 제안한 제작 난이도는 교사의 검토가 필요하다. 기술 용어를 외우는 시간으로 바꾸지 않는다.\", \"startTime\": 200, \"endTime\": 210}, {\"sceneId\": \"plan-form\", \"notes\": \"70–74분 | 활동지의 다섯 항목을 채운다: 의도, 화면, 움직임, 소리/관객 관계, 첫 범위. 모르는 부분은 미정으로 적고 강사에게 질문한다. 전체 채팅을 제출하는 것이 아니다.\", \"startTime\": 210, \"endTime\": 220}, {\"sceneId\": \"plan-example\", \"notes\": \"74–77분 | 수업용 창작 예시. 참가자는 자신의 기획과 비교해 빠진 부분을 찾는다. 이 예시가 학생 모두의 정답이 되지 않게 한다. 소리 분석·도형 연결은 이후 실제 제작에서 다룬다.\", \"startTime\": 220, \"endTime\": 230}, {\"sceneId\": \"own-words\", \"notes\": \"77–80분 | AI의 정리문을 읽고 실제로 선택하지 않은 내용을 고친다. 미정은 강사 확인 항목으로 남긴다. 그림 실력과 글 길이는 평가하지 않는다.\", \"startTime\": 230, \"endTime\": 240}, {\"sceneId\": \"share\", \"notes\": \"80–85분 | 짝끼리 각2분 소개하고1분 피드백. 전체 발표보다 모든 학생의 계획 확인을 우선한다. 교사는 실현 범위가 큰 학생부터 짧게 피드백한다.\", \"startTime\": 240, \"endTime\": 250}, {\"sceneId\": \"check\", \"notes\": \"85–88분 | 장비와 입문 수준을 고려해 다음 실습의 최소 범위를 확인한다. 구현하지 않은 기능을 작동한다고 확정하지 않는다. 남은 의문은 한 가지 질문으로 기록한다.\", \"startTime\": 250, \"endTime\": 260}, {\"sceneId\": \"finish\", \"notes\": \"88–90분 | 계획을 개인 노트/파일로 저장한다. 공유 화면에 계정명이나 채팅 사이드바를 노출할 필요는 없다. 다음 수업에서 TouchDesigner 기초와 연결할 수 있으나 세부 도입 회차는 별도 확정한다.\", \"startTime\": 260, \"endTime\": 270}], \"slideSequences\": []}\u003c/script>\u003csection id=\"scene-root\" class=\"scene-frame cover\" data-composition-id=\"root\" data-start=\"0\" data-duration=\"10\" data-width=\"1920\" data-height=\"1080\" data-label=\"대화하며 내 작품을 정합니다.\">\u003cheader class=\"topline\ u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cfooter class=\"footer\">\u003cb>19 / 27\u003c/b>\u003cspan>대화에서 작품 계획으로\u003c/span>\u003c/footer>\u003c/section>\u003csection id=\"scene-rule-prompt\" class=\"scene-frame plain\" data-composition-id=\"rule-prompt\" data-start=\"190\" data-duration=\"10\" data-width=\"1920\" data-height=\"1080\" data-label=\"작동 규칙을 한 문장으로 정리합니다.\">\u003cheader class=\"topline\">\u003cspan>소리지음\u003c/span>\u003cspan class=\"phase\">규칙 정리\u003c/span>\u003c/header>\u003ch1 class=\"slide-title\">작동 규칙을 한 문장으로 정리합니다.\u003c/h1>\u003cdiv class=\"content\">\u003cdiv class=\"prompt-box\">\u003cp>이 작품에서 무엇이 변하면 화면의 무엇이 어떻게 변할지 한 문장으로 정리해줘. 아직 정하지 않은 부분은 나에게 물어봐 줘.\u003c/p>\u003c/div>\u003cp class=\"tool-note\">예: 시간이 지나면 점이 잠깐 멈췄다가 아래로 내려온다.\u003c/p>\u003c/div>\u003cfooter class=\"footer\">\u003cb>20 / 27\u003c/b>\u003cspan>대화에서 작품 계획으로\u003c/span>\u003c/footer>\u003c/section>\u003csection id=\"scene-small-start\" class=\"scene-frame plain\" data-composition-id=\"small-start\" data-start=\"200\" data-duration=\"10\" data-width=\"1920\" data-height=\"1080\" data-label=\"처음 만들 모습은 작게 정합니다.\">\u003cheader class=\"topline\">\u003cspan>소리지음\u003c/span>\u003cspan class=\"phase\">범위 정하기\u003c/span>\u003c/header>\u003ch1 class=\"slide-title\">처음 만들 모습은 작게 정합니다.\u003c/h1>\u003cdiv class=\"content\">\u003cdiv class=\"split\">\u003carticle class=\"panel\">\u003ch3>첫 제작\u003c/h3>\u003cp>파란 점 하나가 멈췄다가 내려온다.\u003c/p>\u003c/article>\u003carticle class=\"panel\">\u003ch3>이후 확장\u003c/h3>\u003cp>소리를 연결하고 점의 수를 늘린다.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003cfooter class=\"footer\">\u003cb>21 / 27\u003c/b>\u003cspan>대화에서 작품 계획으로\u003c/span>\u003c/footer>\u003c/section>\u003csection id=\"scene-plan-form\" class=\"scene-frame plain\" data-composition-id=\"plan-form\" data-start=\"210\" data-duration=\"10\" data-width=\"1920\" data-height=\"1080\" data-label=\"선택한 내용을 작품 계획에 모읍니다.\">\u003cheader class=\"topline\">\u003cspan>소리지음\u003c/span>\u003cspan class=\"phase\">작품 계획 작성\u003c/span>\u003c/header>\u003ch1 class=\"slide-title\">선택한 내용을 작품 계획에 모읍니다.\u003c/h1>\u003cdiv class=\"content\">\u003cdiv class=\"lines\">\u003cdiv class=\"line\">\u003cb>의도와 모습\u003c/b>\u003cspan>표현할 느낌 · 화면의 모양과 색\u003c/span>\u003c/div>\u003cdiv class=\"line\">\u003cb>움직임과 관계\u003c/b>\u003cspan>어떻게 변하는가 · 무엇에 반응하는가\u003c/span>\u003c/div>\u003cdiv class=\"line\">\u003cb>첫 제작 범위\u003c/b>\u003cspan>처음 만들 핵심 동작 하나\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cfooter class=\"footer\">\u003cb>22 / 27\u003c/b>\u003cspan>대화에서 작품 계획으로\u003c/span>\u003c/footer>\u003c/section>\u003csection id=\"scene-plan-example\" class=\"scene-frame plain\" data-composition-id=\"plan-example\" data-start=\"220\" data-duration=\"10\" data-width=\"1920\" data-height=\"1080\" data-label=\"계획을 읽으면 장면이 떠올라야 합니다.\">\u003cheader class=\"topline\">\u003cspan>소리지음\u003c/span>\u003cspan class=\"phase\">완성 예시\u003c/span>\u003c/header>\u003ch1 class=\"slide-title\">계획을 읽으면 장면이 떠올라야 합니다.\u003c/h1>\u003cdiv class=\"content\">\u003cdiv class=\"lines\">\u003cdiv class=\"line\">\u003cb>표현 의도\u003c/b>\u003cspan>비가 올 때의 차분한 느낌\u003c/span>\u003c/div>\u003cdiv class=\"line\">\u003cb>화면과 움직임\u003c/b>\u003cspan>어두운 배경의 파란 원이 커졌다 작아진다.\u003c/span>\u003c/div>\u003cdiv class=\"line\">\u003cb>관계와 첫 범위\u003c/b>\u003cspan>소리의 세기에 따라 원 하나의 크기를 바꾼다.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cfooter class=\"footer\">\u003cb>23 / 27\u003c/b>\u003cspan>대화에서 작품 계획으로\u003c/span>\u003c/footer>\u003c/section>\u003csection id=\"scene-own-words\" class=\"scene-frame plain\" data-composition-id=\"own-words\" data-start=\"230\" data-duration=\"10\" data-width=\"1920\" data-height=\"1080\" data-label=\"내 말과 스케치로 다시 확인합니다.\">\u003cheader class=\"topline\">\u003cspan>소리지음\u003c/span>\u003cspan class=\"phase\">계획 점검\u003c/span>\u003c/header>\u003ch1 class=\"slide-title\">내 말과 스케치로 다시 확인합니다.\u003c/h1>\u003cdiv class=\"content\">\u003cdiv class=\"split\">\u003carticle class=\"panel\">\u003ch3>장면을 그립니다\u003c/h3>\u003cp>모양과 움직임을 간단한 그림·화살표로 표시합니다.\u003c/p>\u003c/article>\u003carticle class=\"panel\">\u003ch3>선택을 표시합니다\u003c/h3>\u003cp>AI 제안 중 내가 남긴 것과 바꾼 것을 적습니다.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003cfooter class=\"footer\">\u003cb>24 / 27\u003c/b>\u003cspan>대화에서 작품 계획으로\u003c/span>\u003c/footer>\u003c/section>\u003csection id=\"scene-share\" class=\"scene-frame plain\" data-composition-id=\"share\" data-start=\"240\" data-duration=\"10\" data-width=\"1920\" data-height=\"1080\" data-label=\"작품을 짧게 소개하고 질문을 받습니다.\">\u003cheader class=\"topline\">\u003cspan>소리지음\u003c/span>\u003cspan class=\"phase\">공유하기\u003c/span>\u003c/header>\u003ch1 class=\"slide-title\">작품을 짧게 소개하고 질문을 받습니다.\u003c/h1>\u003cdiv class=\"content\">\u003cdiv class=\"statement\">\u003cp>“나는 ___을 표현하려고, ___이 ___하게 움직이는 작품을 만들겠습니다.”\u003c/p>\u003cdiv class=\"statement-sub\">듣는 사람은 화면이 떠오르는 부분 하나와 궁금한 점 하나를 말합니다.\u003c/div>\u003c/div>\u003c/div>\u003cfooter class=\"footer\">\u003cb>25 / 27\u003c/b>\u003cspan>대화에서 작품 계획으로\u003c/span>\u003c/footer>\u003c/section>\u003csection id=\"scene-check\" class=\"scene-frame plain\" data-composition-id=\"check\" data-start=\"250\" data-duration=\"10\" data-width=\"1920\" data-height=\"1080\" data-label=\"처음 만들 범위를 강사와 확인합니다.\">\u003cheader class=\"topline\">\u003cspan>소리지음\u003c/span>\u003cspan class=\"phase\">제작 범위 확인\u003c/span>\u003c/header>\u003ch1 class=\"slide-title\">처음 만들 범위를 강사와 확인합니다.\u003c/h1>\u003cdiv class=\"content\">\u003cdiv class=\"cards\">\u003carticle class=\"card\">\u003cdiv class=\"step\">01\u003c/div>\u003ch3>정한 것\u003c/h3>\u003cp>소재 · 화면 · 움직임\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003cdiv class=\"step\">02\u003c/div>\u003ch3>확인할 것\u003c/h3>\u003cp>소리나 관객과의 연결 방법\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003cdiv class=\"step\">03\u003c/div>\u003ch3>다음에 만들 것\u003c/h3>\u003cp>핵심 동작이 보이는 첫 화면\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003cfooter class=\"footer\">\u003cb>26 / 27\u003c/b>\u003cspan>대화에서 작품 계획으로\u003c/span>\u003c/footer>\u003c/section>\u003csection id=\"scene-finish\" class=\"scene-frame end\" data-composition-id=\"finish\" data-start=\"260\" data-duration=\"10\" data-width=\"1920\" data-height=\"1080\" data-label=\"내가 정한 작품 계획을 저장합니다.\">\u003cheader class=\"topline\">\u003cspan>소리지음\u003c/span>\u003cspan class=\"phase\">마무리\u003c/span>\u003c/header>\u003ch1 class=\"slide-title\">내가 정한 작품 계획을 저장합니다.\u003c/h1>\u003cdiv class=\"content\">\u003cdiv class=\"statement\">\u003cp>대화에서 고른 생각을, 다음 제작의 출발점으로 가져갑니다.\u003c/p>\u003cdiv class=\"statement-sub\">작품 계획 한 장 + 간단한 스케치 + 확인할 질문 하나\u003c/div>\u003c/div>\u003c/div>\u003cfooter class=\"footer\">\u003cb>27 / 27\u003c/b>\u003cspan>대화에서 작품 계획으로\u003c/span>\u003c/footer>\u003c/section>\u003cscript>\n(function(){\n const scenes=Array.from(document.querySelectorAll('.scene-frame'));\n let active=null;\n function stopEmbeds(scene){scene.querySelectorAll('.embed-mount').forEach(m=>m.replaceChildren());scene.querySelectorAll('.play-video,.poster').forEach(e=>e.hidden=false);}\n function show(time){\n  const index=Math.max(0,Math.min(scenes.length-1,Math.floor(time/10)));\n  if(active===scenes[index])return;\n  if(active)stopEmbeds(active);\n  scenes.forEach((el,i)=>{const on=i===index;el.style.opacity=on?'1':'0';el.style.visibility=on?'visible':'hidden';el.style.pointerEvents=on?'auto':'none';el.setAttribute('aria-hidden',String(!on));});\n  active=scenes[index];window.__activeSlide=index;\n }\n window.__timelines=window.__timelines||{};\n const root=gsap.timeline({paused:true});root.to({cursor:0},{cursor:scenes.length,duration:scenes.length*10,ease:'none'});\n window.__timelines.root=root;root.eventCallback('onUpdate',()=>show(root.time()));window.__hfSetTime=show;show(0);\n document.querySelectorAll('.play-video').forEach(button=>button.addEventListener('click',()=>{\n  const box=button.closest('.video-box'), f=document.createElement('iframe');\n  const provider=box.dataset.provider,id=box.dataset.videoId;\n  const url=provider==='youtube'?'https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1&enablejsapi=1':'https://player.vimeo.com/video/'+id+'?autoplay=1&dnt=1&title=0&byline=0';\n  f.src=url;f.title=box.dataset.recording;f.allow='autoplay; fullscreen; picture-in-picture; encrypted-media';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';\n  box.querySelector('.embed-mount').replaceChildren(f);button.hidden=true;box.querySelector('.poster').hidden=true;\n }));\n function postTimeline(){parent.postMessage({source:'hf-preview',type:'timeline',durationInFrames:scenes.length*300,scenes:scenes.map((e,i)=>({id:e.dataset.compositionId,start:i*10,duration:10}))},'*');}\n window.addEventListener('load',postTimeline);postTimeline();\n})();\n\u003c/script>\u003c/body>\u003c/html>"</script><script>document.querySelector('hyperframes-player').setAttribute('srcdoc',JSON.parse(document.getElementById('composition-source').textContent));</script></body></html>
