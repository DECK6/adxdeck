rompt": "목표: {{스프레드시트 URL}}의 설문 응답을 읽기 전용으로 분석해 요약 보고서를 만든다.\n조건:\n- 로그인 계정이 여러 개이므로 /spreadsheets/u/{uid}/d/... 형태로 연결하고, 편집 화면에 보이는 계정이 맞는지 확인한다.\n- 장문 셀은 이름 상자로 셀 주소를 선택한 뒤 수식 입력줄의 textContent를 읽는다. 화면 표시만 보고 요약하지 않는다.\n- 복수 선택 응답은 전체 선택지 목록을 확정한 뒤 그 문자열 기준으로 집계한다. 선택지 안에도 쉼표가 있을 수 있다.\n- 난이도·속도 척도(3이 적정)를 만족도 점수와 합치지 않는다.\n- readSheet가 빈 셀을 돌려주면(xlsx 가져오기 문서) 보이는 범위를 readSelection으로 다시 확인하기 전에는 비어 있다고 판단하지 않는다.\n결과물: 문항별 집계 표, 장문 응답 주제 분류(대표 인용 포함), 후속 교육 신호 요약.\n확인 기준: 응답 수 합계가 시트 행 수와 같고, 인용문이 원문 셀과 정확히 일치한다.\nSTOP: 시트는 수정하지 않는다. 쓰기가 필요하면 별도 탭이나 사본에 쓰자고 먼저 제안한다.", "stop": "시트는 수정하지 않는다. 쓰기가 필요하면 별도 탭이나 사본에 쓰자고 먼저 제안한다.", "status": "내 실사용", "sites": ["docs.google.com"], "sample": "목표: Google Drive에서 이름에 '설문'이 들어간 가장 최근 스프레드시트의 설문 응답을 읽기 전용으로 분석해 요약 보고서를 만든다.\n조건:\n- 로그인 계정이 여러 개이므로 /spreadsheets/u/{uid}/d/... 형태로 연결하고, 편집 화면에 보이는 계정이 맞는지 확인한다.\n- 장문 셀은 이름 상자로 셀 주소를 선택한 뒤 수식 입력줄의 textContent를 읽는다. 화면 표시만 보고 요약하지 않는다.\n- 복수 선택 응답은 전체 선택지 목록을 확정한 뒤 그 문자열 기준으로 집계한다. 선택지 안에도 쉼표가 있을 수 있다.\n- 난이도·속도 척도(3이 적정)를 만족도 점수와 합치지 않는다.\n- readSheet가 빈 셀을 돌려주면(xlsx 가져오기 문서) 보이는 범위를 readSelection으로 다시 확인하기 전에는 비어 있다고 판단하지 않는다.\n결과물: 문항별 집계 표, 장문 응답 주제 분류(대표 인용 포함), 후속 교육 신호 요약.\n확인 기준: 응답 수 합계가 시트 행 수와 같고, 인용문이 원문 셀과 정확히 일치한다.\nSTOP: 시트는 수정하지 않는다. 쓰기가 필요하면 별도 탭이나 사본에 쓰자고 먼저 제안한다.\n로그인되어 있지 않으면 멈추고 알려 주세요. 해당 시트가 없으면 찾은 결과만 알리고 멈추세요. 발송·발행·게시·결제·삭제는 절대 하지 마세요.", "session": null}, {"id": "M12", "group": "내 활용 · 업무", "title": "Google Drive 업로드와 실제 반영 검증", "why": "파일 선택기는 세션 폴더 밖 경로를 거부하고, 완료 토스트는 믿을 수 없으며, 한글 파일명은 NFD/NFC 차이가 있다.", "prompt": "목표: {{로컬 파일}}을 Drive {{대상 폴더 URL}}에 올리고 실제로 반영됐는지 검증한다.\n조건:\n- 파일 선택기가 /Volumes 등 외부 경로를 거부하면, 파일을 현재 Aside 세션의 tmp로 복사하고 바이트 크기를 다시 확인한 뒤 올린다.\n- 업로드 전에 같은 이름의 파일이 있는지 유니코드 정규화(NFC) 후 비교한다.\n- 업로드 후에는 오래된 완료 대화상자를 닫고 폴더를 새로고침한다. 목록 보기의 '파일 크기' 열에서 정확한 파일명과 크기를 확인한다.\n- 폴더 ID가 URL과 화면에서 같은지 확인한다. 브레드크럼 이동 뒤에는 둘이 어긋날 수 있다.\n- 동영상이라면 업로드 완료와 서버 측 처리 완료를 구분해서 보고한다.\n결과물: 업로드한 파일의 이름, 크기, 폴더 ID, 공유 권한 상태를 정리한 확인 표.\n확인 기준: Drive 목록 크기가 로컬 바이트 크기와 <script>
const {items,refs}=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=s=>esc(s).replace(/\{\{([^}]+)\}\}/g,'<span class="ph">{{$1}}</span>');
const groups=[...new Set(items.map(i=>i.group))];
let cur='전체';
const chips=document.getElementById('chips');
['전체',...groups].forEach(g=>{const b=document.createElement('button');b.className='chip'+(g==cur?' on':'');b.textContent=g;b.onclick=()=>{cur=g;[...chips.children].forEach(c=>c.classList.toggle('on',c==b));render()};chips.appendChild(b)});
const okS=s=>/실제 실행|내 실사용|내 루틴|공식/.test(s||'');
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const L=document.getElementById('list');L.innerHTML='';
  groups.filter(g=>cur=='전체'||g==cur).forEach(g=>{
    const its=items.filter(i=>i.group==g&&(!q||JSON.stringify(i).toLowerCase().includes(q)));
    if(!its.length)return;
    L.insertAdjacentHTML('beforeend',`<div class="group">${esc(g)}<small>${its.length}</small></div>`);
    const G=document.createElement('div');G.className='grid';
    its.forEach(i=>{const c=document.createElement('div');c.className='card';
      c.innerHTML=`<div class="id">${esc(i.id)}</div><h3>${esc(i.title)}</h3>${i.session?'<span class="tag ok" style="align-self:flex-start">세션 열림</span>':''}<p>${esc(i.why)}</p><div><span class="tag ${okS(i.status)?'ok':''}">${esc(i.status)}</span>${(i.sites||[]).slice(0,2).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>`;
      c.onclick=()=>open_(i);G.appendChild(c)});
    L.appendChild(G)});
}
const cliOf=i=>i.cli||('aside '+JSON.stringify(i.prompt).replace(/\$/g,'\\$').replace(/`/g,'\\`'));
function open_(i){
  const r=(i.refs||[]).map(k=>refs[k]?`<a href="${esc(refs[k].url)}" target="_blank">${esc(k)} ${esc(refs[k].title)}</a>`:esc(k)).join(' · ');
  document.getElementById('dc').innerHTML=`<div class="id" style="color:var(--acc);font-weight:700">${esc(i.id)} · ${esc(i.group)}</div>
  <h2>${esc(i.title)}</h2><div class="meta">${esc(i.why)}</div>
  <div class="prompt">${hl(i.prompt)}</div>
  <div class="meta"><b>멈춤 지점</b> ${esc(i.stop)}</div>
  <div class="meta"><b>상태</b> ${esc(i.status)}${i.sites&&i.sites.length?' · <b>사이트</b> '+esc(i.sites.join(', ')):''}</div>
  ${r?`<div class="meta"><b>근거</b> ${r}</div>`:''}
  ${i.sample&&i.sample!=i.prompt?`<details><summary class="meta"><b>예시 값으로 채운 버전</b></summary><div class="prompt" style="background:var(--card)">${esc(i.sample)}</div></details>`:''}
  ${i.session?`<div class="meta"><b>Aside 세션</b> <code>${esc(i.session)}</code> — 이 프롬프트로 연 세션이 Aside 세션 목록에 <b>[${esc(i.id)}]</b> 제목으로 있습니다.</div>`:''}
  <div class="meta" style="margin-top:12px"><b>터미널</b></div><div class="cli">${esc(cliOf(i))}</div>
  <div class="row"><button class="btn" id="c1">프롬프트 복사</button><button class="btn ghost" id="c2">터미널 명령 복사</button>${i.session?`<button class="btn ghost" id="c3">세션 이어가기 명령 복사</button>`:''}<button class="btn ghost" id="cx">닫기</button></div>`;
  document.getElementById('c1').onclick=()=>copy(i.prompt);
  document.getElementById('c2').onclick=()=>copy(cliOf(i));
  if(i.session)document.getElementById('c3').onclick=()=>copy(`aside session resume ${i.session} "이어서 진행해 주세요"`);
  document.getElementById('cx').onclick=()=>d.close();
  d.showModal();
}
const d=document.getElementById('d');d.onclick=e=>{if(e.target==d)d.close()};
function copy(s){navigator.clipboard.writeText(s).then(()=>{const t=document.getElementById('t');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1200)})}
document.getElementById('q').oninput=render;render();
</script></body></html>
